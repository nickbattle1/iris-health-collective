<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#522e63" />
    <meta
      name="description"
      content="Iris Health Collective helps you find LGBTIQ+ affirming health services across Victoria."
    />
    <link rel="icon" type="image/png" href="/images/tab-icon.png" />
    <link rel="apple-touch-icon" href="/images/tab-icon.png" />

    <!-- puts a thumbnail on the link when someone shares it. adds legitimacy-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Iris Health Collective" />
    <meta property="og:url" content="https://iris-health-collective.web.app/" />
    <meta property="og:title" content="Iris Health Collective" />
    <meta
      property="og:description"
      content="Iris Health Collective helps you find LGBTIQ+ affirming health services across Victoria."
    />
    <!-- 1200x630 crop of thumbnail.jpeg. meta wants that exact shape -->
    <meta
      property="og:image"
      content="https://iris-health-collective.web.app/images/thumbnail-og.jpeg"
    />
    <meta
      property="og:image:secure_url"
      content="https://iris-health-collective.web.app/images/thumbnail-og.jpeg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Iris Health Collective, affirming health services for LGBTIQ+ Victorians."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Iris Health Collective" />
    <meta
      name="twitter:description"
      content="Iris Health Collective helps you find LGBTIQ+ affirming health services across Victoria."
    />
    <meta
      name="twitter:image"
      content="https://iris-health-collective.web.app/images/thumbnail-og.jpeg"
    />

    <title>Iris Health Collective</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
